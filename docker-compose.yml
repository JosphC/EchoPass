# EchoPass local stack: Metro (app) + mock API + one-shot quality checks.
services:
  app:
    # Metro/Expo for a physical phone running a custom dev client.
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file: .env
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME}
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL}
      EXPO_PUBLIC_USE_MOCKS: ${EXPO_PUBLIC_USE_MOCKS}
    ports:
      - "8081:8081"
      - "8082:8082"
      - "19000:19000"
      - "19001:19001"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      mock-api:
        condition: service_healthy

  mock-api:
    build:
      context: .
      dockerfile: docker/mock-api.Dockerfile
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s

  checks:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      CI: "true"
      EXPO_PUBLIC_USE_MOCKS: "true"
    command: ["sh", "-c", "npm run typecheck && npm run lint && npm test -- --ci --forceExit"]

volumes:
  app_node_modules:
